<style>
  :root {
    --navy: #1B2A4A; --navy2: #23375F; --teal: #2E7D6E; --gold: #C99A2E;
    --ink: #1A1A1A; --mute: #5B6B7A; --soft: #EFF3F1; --line: #E3E7E9; --white: #FFFFFF;
  }
  * { box-sizing: border-box; }
  #quiz-app {
    font-family: Calibri, "Segoe UI", system-ui, sans-serif; color: var(--ink); background: var(--white);
    max-width: 880px; margin: 0 auto; line-height: 1.5; padding-bottom: 60px;
  }
  #quiz-app h1, #quiz-app h2 { margin: 0; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between; padding: 12px 20px;
    border-bottom: 3px solid var(--gold); background: var(--navy); color: white; position: sticky; top: 0; z-index: 20;
  }
  .topbar .title { font-size: 15px; font-weight: 700; }
  .topbar .right { display:flex; align-items:center; gap: 12px; }
  .staff-btn {
    background: transparent; border: 1px solid rgba(255,255,255,0.25); color: rgba(255,255,255,0.55);
    width: 30px; height: 30px; border-radius: 999px; font-size: 13px; cursor: pointer; line-height: 1;
  }
  .staff-btn:hover { color: white; border-color: rgba(255,255,255,0.5); }
  .hero { padding: 20px 20px 8px; border-bottom: 1px solid var(--line); }
  .hero .eyebrow { color: var(--teal); font-weight: 700; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; }
  .hero h1 { font-size: 22px; margin-top: 4px; }
  .hero .sub { color: var(--mute); font-style: italic; margin-top: 4px; font-size: 14px; }
  .panel { padding: 18px 20px; }
  .setup-grid { display:grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 4px; }
  @media (max-width: 640px) { .setup-grid { grid-template-columns: 1fr; } }
  label.field-label { display:block; font-size: 12px; font-weight: 700; color: var(--navy); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .4px; }
  input[type=text], input[type=date], select, textarea {
    width: 100%; padding: 9px 10px; border: 1.5px solid var(--line); border-radius: 8px;
    font-size: 14px; font-family: inherit; color: var(--ink); background: white;
  }
  textarea { resize: vertical; font-family: Calibri, "Segoe UI", system-ui, sans-serif; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--teal); outline-offset: 1px; border-color: var(--teal); }
  .part-header {
    margin-top: 28px; padding: 10px 16px; background: var(--navy); color: white; border-radius: 10px;
    font-size: 14px; font-weight: 700; display:flex; justify-content: space-between; align-items:center;
  }
  .part-header .count { font-weight: 500; font-size: 12.5px; color: #C7D3E8; }
  .part-intro { font-size: 13px; color: var(--mute); margin: 10px 2px 0; font-style: italic; }
  .formula-box { margin-top: 12px; padding: 12px 16px; background: #F4F7FC; border: 1px solid #D7E0F0; border-left: 4px solid var(--navy); border-radius: 8px; }
  .formula-box-title { font-weight: 700; font-size: 12.5px; color: var(--navy); text-transform: uppercase; letter-spacing: .4px; margin-bottom: 6px; }
  .formula-list { margin: 0; padding-left: 18px; }
  .formula-list li { font-size: 13px; color: var(--ink); margin-bottom: 4px; line-height: 1.45; }
  .q { margin-top: 16px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; }
  .q .qnum { display:inline-block; background: var(--soft); color: var(--navy); font-weight: 700; font-size: 12px; padding: 2px 9px; border-radius: 999px; margin-bottom: 8px; }
  .q .qnum.marks { background: none; color: var(--mute); font-weight: 600; float: right; }
  .q label.qtext { display:block; font-weight: 600; font-size: 14.5px; margin-bottom: 8px; }
  .q .qimg { display: block; max-width: 260px; height: auto; margin: 4px 0 12px; }
  .q .qimg.wide { max-width: 340px; }
  .mcq-opts { display: grid; gap: 6px; }
  .mcq-opt { display:flex; align-items:center; gap: 8px; padding: 8px 10px; border: 1.5px solid var(--line); border-radius: 8px; cursor: pointer; font-size: 13.5px; }
  .mcq-opt:hover { border-color: var(--teal); }
  .mcq-opt input { margin: 0; }
  .subpart { margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--line); }
  .subpart:first-child { margin-top: 4px; padding-top: 0; border-top: none; }
  .subpart .sublabel { font-weight: 700; font-size: 13px; color: var(--navy); margin-bottom: 6px; }
  .shared-imgs { display: flex; gap: 20px; flex-wrap: wrap; margin: 8px 0 14px; }
  .btn { background: var(--navy); color: white; border: none; padding: 11px 22px; border-radius: 999px; font-size: 14px; font-weight: 700; cursor: pointer; }
  .btn:hover { background: var(--navy2); }
  .btn.secondary { background: white; color: var(--navy); border: 1.5px solid var(--navy); }
  .btn.small { padding: 6px 14px; font-size: 12.5px; }
  .submit-row { position: sticky; bottom: 0; margin: 26px -20px 0; padding: 14px 20px; background: white; border-top: 1px solid var(--line); box-shadow: 0 -4px 14px rgba(20,25,40,0.08); display:flex; align-items:center; gap:16px; flex-wrap:wrap; z-index: 15; }
  .status-msg { font-size: 13.5px; font-weight: 600; }
  .status-msg.ok { color: var(--teal); }
  .status-msg.err { color: #B3271E; }
  .footnote { font-size: 12px; color: var(--mute); margin-top: 10px; }
  .mcq-opt.correct-answer { border-color: var(--teal); background: #EAF5F2; }
  .mcq-opt.wrong-answer { border-color: #B3271E; background: #FBEEEC; }
  .fb-line { font-size: 13px; font-weight: 700; margin-top: 8px; }
  .fb-line.correct { color: var(--teal); }
  .fb-line.incorrect { color: #B3271E; }
  .answer-row { margin-top: 10px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .answer-label { font-size: 13.5px; font-weight: 600; min-width: 70px; }
  .answer-input-wrap { display: flex; flex-direction: column; gap: 4px; }
  .answer-input-wrap input[type=text] { max-width: 220px; }
  .answer-input-wrap input.ans-correct { border-color: var(--teal); background: #EAF5F2; }
  .answer-input-wrap input.ans-incorrect { border-color: #B3271E; background: #FBEEEC; }
  .answer-input-wrap .fb-line { margin-top: 0; }
  .teacher-toolbar { display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; margin-bottom:16px; }
  .teacher-toolbar .field { min-width: 140px; }
  table.roster { width:100%; border-collapse:collapse; font-size:13px; }
  table.roster th { text-align:left; padding:8px 10px; background:var(--navy); color:white; position:sticky; top:0; }
  table.roster td { padding:8px 10px; border-bottom:1px solid var(--line); }
  table.roster tr:hover td { background: #F7F9FC; cursor:pointer; }
  .empty-state { text-align:center; padding: 50px 20px; color: var(--mute); }
  .modal-backdrop { position:fixed; inset:0; background:rgba(20,25,40,0.55); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px; }
  .modal { background:white; border-radius:14px; max-width:700px; width:100%; max-height:85vh; overflow-y:auto; padding:22px; }
  .modal h3 { color: var(--navy); font-size:18px; margin-bottom:4px; }
  .modal .meta { color: var(--mute); font-size:12.5px; margin-bottom:16px; }
  .modal .section-h { font-weight:700; font-size:13px; color: var(--navy); margin: 18px 0 8px; text-transform: uppercase; letter-spacing:.4px; }
  .modal .block { margin-bottom:14px; }
  .modal .block .k { font-weight:700; font-size:12.5px; color: var(--teal); text-transform:uppercase; letter-spacing:.3px; margin-bottom:3px;}
  .modal .block .v { font-size:14px; white-space:pre-wrap; }
  .modal .block .qimg-modal { display:block; max-width: 220px; height:auto; margin: 6px 0; }
  .modal-close { float:right; background:none; border:none; font-size:20px; cursor:pointer; color:var(--mute); line-height:1;}
  .badge-cls { background: var(--soft); color: var(--navy); padding: 2px 8px; border-radius: 999px; font-size:11.5px; font-weight:700; }
</style>

<div id="quiz-app">
  <div class="topbar">
    <div class="title">Year 9 Mathematics &middot; T3 Revision Booklet</div>

</div>

  // Shuffle helper (Fisher-Yates) — randomises Part A's question order and
  // each question's option order per student. Answers are stored/scored
  // against the ORIGINAL indices, so the answer key and teacher dashboard
  // are unaffected by the shuffle.
  function shuffledIndices(n) {
    const arr = Array.from({ length: n }, (_, i) => i);
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }
  const QUESTION_ORDER = shuffledIndices(PART_A.length);
  const OPTION_ORDER = PART_A.map((mcq) => shuffledIndices(mcq.options.length));

  // Build flat lists of Part B / Part C answer keys, e.g. "1a_c","5a_perimeter","7a_a"...
  const PART_B_KEYS = [];
  PART_B.forEach((q) => q.parts.forEach((p) => p.answers.forEach((a) => PART_B_KEYS.push(q.num + p.label + "_" + a.key))));
  const PART_C_KEYS = [];
  PART_C.parts.forEach((p) => p.answers.forEach((a) => PART_C_KEYS.push(PART_C.num + p.label + "_" + a.key)));

  let state = {

    extendedAnswers: {}, // keyed by "1a_v","1b_r","1c_sa_prism",...

  // ---- Answer checking for Part B / Part C ----
  // Accepts a numeric value (within tolerance) or, for surd-form answers, one
  // of a small set of accepted text forms. Never reveals the correct value —
  // only whether the student's own entry is right, wrong, or missing a unit.
  const UNIT_SYMBOL_MAP = { "cm2": "cm\u00b2", "cm^2": "cm\u00b2", "m2": "m\u00b2", "m^2": "m\u00b2", "sqcm": "cm\u00b2", "sqm": "m\u00b2", "deg": "\u00b0", "degrees": "\u00b0" };
  function normalizeUnit(u) {
    let s = (u || "").toLowerCase().replace(/\s+/g, "");
    if (UNIT_SYMBOL_MAP[s]) return UNIT_SYMBOL_MAP[s];
    return s;
  }
  function normalizeExact(s) {
    return (s || "").toLowerCase().replace(/\s+/g, "").replace(/sqrt/g, "\u221a").replace(/root/g, "\u221a");
  }
  // status: "empty" | "unit-missing" | "correct" | "incorrect"
  function gradeAnswer(raw, spec) {
    const input = (raw || "").trim();
    if (!input) return "empty";
    if (spec.exactStrings) {
      const norm = normalizeExact(input);
      if (spec.exactStrings.some((s) => normalizeExact(s) === norm)) return "correct";
    }
    const m = input.match(/-?\d+(\.\d+)?/);
    if (!m) return "incorrect";
    const num = parseFloat(m[0]);
    const rest = input.slice(m.index + m[0].length).trim();
    const numOk = Math.abs(num - spec.decimal) <= spec.tolerance;
    if (!numOk) return "incorrect";
    if (!spec.unit) return "correct";
    // Degree sign can't be typed on a normal keyboard, so a blank "unit" is
    // always accepted for angle answers (typing it in is still fine too).
    if (spec.unit === "\u00b0" && (spec.unitAliases || []).includes("\u00b0")) {
      const restNorm = normalizeUnit(rest);
      const unitOk = rest === "" || (spec.unitAliases || []).some((u) => normalizeUnit(u) === restNorm);
      return unitOk ? "correct" : "unit-missing";
    }
    const restNorm = normalizeUnit(rest);
    const unitOk = (spec.unitAliases || [spec.unit]).some((u) => normalizeUnit(u) === restNorm);
    return unitOk ? "correct" : "unit-missing";
  }
  function findAnswerSpec(flatKey) {
    for (const qb of PART_B) {
      for (const p of qb.parts) {
        for (const a of p.answers) {
          if (qb.num + p.label + "_" + a.key === flatKey) return a;
        }
      }
    }
    for (const p of PART_C.parts) {
      for (const a of p.answers) {
        if (PART_C.num + p.label + "_" + a.key === flatKey) return a;
      }
    }
    return null;
  }

  function elx(tag, attrs, children) {
    const e = document.createElement(tag);

      else e.setAttribute(k, attrs[k]);

    (children || []).forEach((c) => { if (c) e.appendChild(c); });
    return e;

      "Parallel lines: co-interior angles sum to 180\u00b0, alternate and corresponding angles are equal",
      "Exterior angle of a regular polygon = 360\u00b0 \u00f7 number of sides",
      "Congruence tests: SSS, SAS, AAS, RHS",
    ]));
    QUESTION_ORDER.forEach((qi, displayPos) => {
      const mcq = PART_A[qi];
      const q = elx("div", { class: "q" });
      q.appendChild(elx("div", { class: "qnum" }, [text("Q" + (displayPos + 1))]));
      q.appendChild(elx("label", { class: "qtext" }, [text(mcq.stem)]));
      if (mcq.img) {
        q.appendChild(elx("img", { class: "qimg", src: mcq.img, alt: "Diagram for Q" + (displayPos + 1) }));
      }
      const opts = elx("div", { class: "mcq-opts" });
      const givenOi = state.mcqAnswers[qi];
      const wasAnswered = givenOi !== null && givenOi !== undefined;
      OPTION_ORDER[qi].forEach((oi) => {
        const optText = mcq.options[oi];
        const optRow = elx("label", { class: "mcq-opt" });
        const input = elx("input", { type: "radio", name: "mcq" + qi });
        input.checked = givenOi === oi;
        input.onchange = () => { state.mcqAnswers[qi] = oi; };
        if (checked && wasAnswered) {
          if (givenOi === mcq.correct && oi === mcq.correct) optRow.classList.add("correct-answer");
          else if (oi === givenOi) optRow.classList.add("wrong-answer");
        }
        optRow.appendChild(input);
        optRow.appendChild(text(optText));
        opts.appendChild(optRow);
      });
      q.appendChild(opts);
      if (checked) {
        const isCorrect = wasAnswered && givenOi === mcq.correct;
        const fb = elx("div", { class: "fb-line " + (isCorrect ? "correct" : "incorrect") }, [
          text(isCorrect ? "Correct!" : (wasAnswered ? "Not quite — have another go." : "Not answered yet."))
        ]);
        q.appendChild(fb);
      }
      root.appendChild(q);
    });

    // Renders one answer-input row (number + unit) with optional inline
    // check feedback. store = state.shortAnswers or state.extendedAnswers.
    function renderAnswerRow(store, key, spec) {
      const row = elx("div", { class: "answer-row" });
      if (spec.prompt) row.appendChild(elx("div", { class: "answer-label" }, [text(spec.prompt + (spec.unit ? " (" + spec.unit + ")" : "") + ":")]));
      const inputWrap = elx("div", { class: "answer-input-wrap" });
      const showUnitHint = spec.unit && spec.unit !== "\u00b0";
      const input = elx("input", { type: "text", placeholder: showUnitHint ? "e.g. 12.08 " + spec.unit : (spec.unit === "\u00b0" ? "e.g. 38 (no need for the \u00b0 symbol)" : "Your answer") });
      input.value = store[key] || "";
      input.oninput = (e) => { store[key] = e.target.value; };
      inputWrap.appendChild(input);
      if (spec.autoCheck === false) {
        row.appendChild(inputWrap);
        row.appendChild(elx("div", { class: "footnote", style: "margin-top:4px;" }, [text("Not auto-checked \u2014 your teacher will check this one.")]));
        return row;
      }
      if (checked) {
        const status = gradeAnswer(store[key], spec);
        if (status === "correct") input.classList.add("ans-correct");
        else if (status !== "empty") input.classList.add("ans-incorrect");
        let msg = "";
        if (status === "correct") msg = "Correct!";
        else if (status === "unit-missing") msg = "Check your unit.";
        else if (status === "incorrect") msg = "Not quite \u2014 have another go.";
        else msg = "Not answered yet.";
        inputWrap.appendChild(elx("div", { class: "fb-line " + (status === "correct" ? "correct" : "incorrect") }, [text(msg)]));
      }
      row.appendChild(inputWrap);
      return row;
    }

    // ---- Part B: Short answer ----
    root.appendChild(elx("div", { class: "part-header" }, [
      elx("span", {}, [text("Part B \u2014 Short Answer")]),
      elx("span", { class: "count" }, [text("23 marks \u00B7 enter your final answer \u00B7 auto-checked")]),
    ]));
    root.appendChild(renderFormulaBox("Formulas you may need", [
      "Pythagoras\u2019 theorem: c\u00b2 = a\u00b2 + b\u00b2, so a = \u221a(c\u00b2 \u2212 b\u00b2)",
      "Trigonometric ratios: sin\u03b8 = O/H, cos\u03b8 = A/H, tan\u03b8 = O/A",
      "Perimeter = sum of all side lengths  \u00b7  Area of a rectangle = length \u00d7 width  \u00b7  Area of a triangle = \u00bd \u00d7 base \u00d7 height",
      "Angle sum of a triangle = 180\u00b0  \u00b7  Angle sum of a quadrilateral = 360\u00b0",
      "Angles at a point (revolution) = 360\u00b0  \u00b7  Vertically opposite angles are equal",
      "Parallel lines: co-interior angles sum to 180\u00b0, alternate and corresponding angles are equal",
      "Sum of interior angles of a polygon = (n \u2212 2) \u00d7 180\u00b0, where n = number of sides",
    ]));
    root.appendChild(elx("div", { class: "part-intro" }, [text("Do your full working on paper. Enter only your final answer (with units, where needed) below, then use \u201cCheck my answers\u201d.")]));
    PART_B.forEach((qb) => {
      const q = elx("div", { class: "q" });
      q.appendChild(elx("div", { class: "qnum" }, [text("Q" + qb.num)]));
      q.appendChild(elx("div", { class: "qnum marks" }, [text("(" + qb.marks + ")")]));
      q.appendChild(elx("label", { class: "qtext" }, [text(qb.prompt)]));
      qb.parts.forEach((p) => {
        const sp = elx("div", { class: "subpart" });
        sp.appendChild(elx("div", { class: "sublabel" }, [text(p.label)]));
        if (p.img) sp.appendChild(elx("img", { class: "qimg", src: p.img, alt: "Diagram for Q" + qb.num + p.label }));
        p.answers.forEach((spec) => {
          const key = qb.num + p.label + "_" + spec.key;
          sp.appendChild(renderAnswerRow(state.shortAnswers, key, spec));
        });
        q.appendChild(sp);
      });
      root.appendChild(q);
    });

    // ---- Part C: Extended response ----
    root.appendChild(elx("div", { class: "part-header" }, [
      elx("span", {}, [text("Part C \u2014 Extended Response")]),
      elx("span", { class: "count" }, [text("8 marks \u00B7 enter your final answer \u00B7 auto-checked")]),
    ]));
    root.appendChild(renderFormulaBox("Formulas you may need", [
      "Volume of a rectangular prism = length \u00d7 width \u00d7 height",
      "Volume of a cylinder = \u03c0r\u00b2h",
      "Surface area of a rectangular prism = 2(lw + lh + wh)",
      "Surface area of a cylinder = 2\u03c0r\u00b2 + 2\u03c0rh",
      "Remember to keep all measurements in the same unit before calculating.",
    ]));
    root.appendChild(elx("div", { class: "part-intro" }, [text("Do your full working on paper. Enter only your final answer (with units, where needed) below, then use \u201cCheck my answers\u201d.")]));
    {
      const q = elx("div", { class: "q" });
      q.appendChild(elx("div", { class: "qnum" }, [text("Q" + PART_C.num)]));
      q.appendChild(elx("div", { class: "qnum marks" }, [text("(" + PART_C.marks + ")")]));
      q.appendChild(elx("label", { class: "qtext" }, [text(PART_C.prompt)]));
      const imgsRow = elx("div", { class: "shared-imgs" });
      PART_C.sharedImages.forEach((src, i) => {
        imgsRow.appendChild(elx("img", { class: "qimg wide", src: src, alt: "Figure " + (i + 1) }));
      });
      q.appendChild(imgsRow);
      PART_C.parts.forEach((p) => {
        const sp = elx("div", { class: "subpart" });
        sp.appendChild(elx("div", { class: "sublabel" }, [text(p.label)]));
        sp.appendChild(elx("label", { class: "qtext" }, [text(p.prompt)]));
        p.answers.forEach((spec) => {
          const key = PART_C.num + p.label + "_" + spec.key;
          sp.appendChild(renderAnswerRow(state.extendedAnswers, key, spec));
        });
        q.appendChild(sp);
      });
      root.appendChild(q);
    }

    // ---- Submit ----
    if (checked) {
      const mcqScoreNow = PART_A.reduce((n, m, i) => n + (state.mcqAnswers[i] === m.correct ? 1 : 0), 0);
      let bcCorrect = 0, bcCheckable = 0;
      PART_B_KEYS.forEach((k) => {
        const spec = findAnswerSpec(k);
        if (!spec || spec.autoCheck === false) return;
        bcCheckable++;
        if (gradeAnswer(state.shortAnswers[k], spec) === "correct") bcCorrect++;
      });
      PART_C_KEYS.forEach((k) => {
        const spec = findAnswerSpec(k);
        if (!spec || spec.autoCheck === false) return;
        bcCheckable++;
        if (gradeAnswer(state.extendedAnswers[k], spec) === "correct") bcCorrect++;
      });
      root.appendChild(elx("div", { class: "score-summary-inline", style: "background:var(--soft); border-radius:10px; padding:12px 16px; margin-top:20px; font-weight:700; color:var(--navy); text-align:center;" }, [
        text("Part A: " + mcqScoreNow + " / " + PART_A.length + " correct \\u00B7 Parts B & C: " + bcCorrect + " / " + bcCheckable + " auto-checked answers correct")
      ]));
    }
    const submitRow = elx("div", { class: "submit-row" });
    const checkBtn = elx("button", { class: "btn secondary" }, [text("Check my answers")]);
    checkBtn.onclick = () => { checked = true; renderStudent(); };
    const saveDraftBtn = elx("button", { class: "btn secondary" }, [text("Save draft")]);
    saveDraftBtn.onclick = handleSaveDraft;
    const btn = elx("button", { class: "btn" }, [text(submitted ? "Update my answers" : "Submit my exam")]);
    btn.onclick = handleSubmit;
    submitRow.appendChild(checkBtn);
    submitRow.appendChild(saveDraftBtn);
    submitRow.appendChild(btn);
    if (submitStatus) submitRow.appendChild(elx("div", { class: "status-msg " + submitStatus.type }, [text(submitStatus.msg)]));
    root.appendChild(submitRow);
    root.appendChild(elx("div", { class: "footnote" }, [text("\"Check my answers\" instantly marks all three parts (you can keep changing answers after). \"Save draft\" saves your progress so you can pick up later on any device \u2014 use \"Load my saved answers\" above. \"Submit my exam\" is your final copy for your teacher \u2014 submitting again replaces your previous submission.")]));
  }

  // ---- Draft save/load (key/value protocol on the same backend) ----
  function slug(s) { return (s || "").toString().trim().toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, ""); }
  function draftKey() { return slug(state.cls) + "__" + slug(state.name); }

  async function handleSaveDraft() {
    if (!state.name.trim() || !state.cls.trim()) {
      submitStatus = { type: "err", msg: "Enter your name and class before saving a draft." };
      renderStudent();
      return;
    }
    if (!ENDPOINT_READY) {
      submitStatus = { type: "err", msg: "This quiz isn't connected yet \u2014 ask your teacher to finish setup." };
      renderStudent();
      return;
    }
    submitStatus = { type: "ok", msg: "Saving draft\u2026" };
    renderStudent();
    const record = {
      name: state.name.trim(), cls: state.cls, date: state.date,
      mcqAnswers: state.mcqAnswers,
      shortAnswers: state.shortAnswers,
      extendedAnswers: state.extendedAnswers,
      savedAt: new Date().toISOString(),
    };
    try {
      const res = await fetch(SUBMIT_ENDPOINT, {
        method: "POST",
        body: JSON.stringify({ type: "save", sheet: QUIZ_ID + "_drafts", key: draftKey(), value: JSON.stringify(record) }),
      });
      const result = await res.json();
      if (!result || result.ok !== true) throw new Error((result && result.error) || "save failed");
      submitStatus = { type: "ok", msg: "Draft saved at " + new Date().toLocaleTimeString() + ". Use \"Load my saved answers\" on any device to pick up where you left off." };
    } catch (err) {
      console.error("Draft save error:", err);
      submitStatus = { type: "err", msg: "Couldn't save your draft right now. Check your connection and try again." };
    }
    renderStudent();
  }

  async function handleLoadDraft() {
    if (!state.name.trim() || !state.cls.trim()) {
      submitStatus = { type: "err", msg: "Enter your name and class first, then load your saved answers." };
      renderStudent();
      return;
    }
    if (!ENDPOINT_READY) {
      submitStatus = { type: "err", msg: "This quiz isn't connected yet \u2014 ask your teacher to finish setup." };
      renderStudent();
      return;
    }
    submitStatus = { type: "ok", msg: "Loading\u2026" };
    renderStudent();
    try {
      const res = await fetch(SUBMIT_ENDPOINT, {
        method: "POST",
        body: JSON.stringify({ type: "get", sheet: QUIZ_ID + "_drafts", key: draftKey() }),
      });
      const result = await res.json();
      if (!result || !result.value) {
        submitStatus = { type: "err", msg: "No saved answers found for that name and class yet." };
        renderStudent();
        return;
      }
      const record = JSON.parse(result.value);
      state.mcqAnswers = record.mcqAnswers || PART_A.map(() => null);
      state.shortAnswers = record.shortAnswers || {};
      state.extendedAnswers = record.extendedAnswers || {};
      PART_B_KEYS.forEach((k) => { if (state.shortAnswers[k] === undefined) state.shortAnswers[k] = ""; });
      PART_C_KEYS.forEach((k) => { if (state.extendedAnswers[k] === undefined) state.extendedAnswers[k] = ""; });
      checked = false;
      submitStatus = { type: "ok", msg: "Loaded your saved answers from " + new Date(record.savedAt).toLocaleString() + "." };
    } catch (err) {
      console.error("Draft load error:", err);
      submitStatus = { type: "err", msg: "Couldn't load your saved answers. Check your connection and try again." };
    }
    renderStudent();
  }

  async function handleSubmit() {
    if (!state.name.trim()) {
      submitStatus = { type: "err", msg: "Please enter your name before submitting." };
      renderStudent();
      return;
    }
    if (!ENDPOINT_READY) {
      submitStatus = { type: "err", msg: "This quiz isn't connected yet \u2014 ask your teacher to finish setup." };
      renderStudent();
      return;
    }
    submitStatus = { type: "ok", msg: "Saving\u2026" };
    renderStudent();
    const mcqScore = PART_A.reduce((n, m, i) => n + (state.mcqAnswers[i] === m.correct ? 1 : 0), 0);
    const payload = {
      quiz: QUIZ_ID,
      name: state.name.trim(), cls: state.cls, date: state.date,
      mcqAnswers: state.mcqAnswers, mcqScore, mcqTotal: PART_A.length,
      questionOrder: QUESTION_ORDER.map((i) => i + 1),
      shortAnswers: PART_B_KEYS.map((k) => state.shortAnswers[k] || ""),
      extendedAnswers: PART_C_KEYS.map((k) => state.extendedAnswers[k] || ""),
      submittedAt: new Date().toISOString(),
    };
    try {
      const res = await fetch(SUBMIT_ENDPOINT, { method: "POST", body: JSON.stringify(payload) });
      const result = await res.json();
      if (!result || result.ok !== true) throw new Error((result && result.error) || "save failed");
      submitted = true;
      submitStatus = { type: "ok", msg: "Submitted! Part A auto-marked score: " + mcqScore + " / " + PART_A.length + " (13 marks). Parts B & C saved for your teacher to mark." };
    } catch (err) {
      console.error("Quiz submit error:", err);
      submitStatus = { type: "err", msg: "Couldn't save right now (" + (err && err.message ? err.message : "unknown error") + "). Check your connection and try again." };
    }
    renderStudent();
  }

  // ---------------- Teacher dashboard ----------------
  let teacherData = [];
  let teacherLoading = false;
  let teacherError = null;
  let filterCls = "All";
  let filterDate = "";

  async function loadTeacherData() {
    if (!ENDPOINT_READY) {
      teacherError = "This dashboard isn't connected to a spreadsheet yet.";
      teacherLoading = false; renderTeacher(); return;
    }
    teacherLoading = true; teacherError = null;
    renderTeacher();
    try {
      const res = await fetch(SUBMIT_ENDPOINT + "?quiz=" + QUIZ_ID, { method: "GET" });
      const rows = await res.json();
      const items = (rows || []).map((r) => ({
        name: r.name, cls: r.cls, date: r.date,
        mcqAnswers: safeParse(r.mcqAnswers, []), mcqScore: Number(r.mcqScore) || 0, mcqTotal: Number(r.mcqTotal) || PART_A.length,
        shortAnswers: safeParse(r.shortAnswers, []),
        extendedAnswers: safeParse(r.extendedAnswers, []),
        submittedAt: r.submittedAt,
      }));
      items.sort((a, b) => (a.name > b.name ? 1 : -1));
      teacherData = items;
    } catch (err) {
      teacherError = "Couldn't load submissions. Check your connection and try refreshing.";
    }
    teacherLoading = false;
    renderTeacher();
  }
  function safeParse(v, fallback) {
    if (v && typeof v === "object") return v;
    try { return JSON.parse(v); } catch (e) { return fallback; }
  }

  function downloadCsv() {
    const rows = [["Name", "Class", "Date", "Part A Score", "Submitted At"]];
    filteredData().forEach((d) => { rows.push([d.name, d.cls, d.date, `${d.mcqScore}/${d.mcqTotal}`, d.submittedAt]); });
    const csv = rows.map((r) => r.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\n");
    const blob = new Blob([csv], { type: "text/csv" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "year9_t3_revision_submissions.csv";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function filteredData() {
    return teacherData.filter((d) => {
      if (filterCls !== "All" && d.cls !== filterCls) return false;
      if (filterDate && d.date !== filterDate) return false;
      return true;
    });
  }

  function showDetail(d) {
    const root = document.getElementById("modal-root");
    root.innerHTML = "";
    const backdrop = elx("div", { class: "modal-backdrop" });
    backdrop.onclick = (e) => { if (e.target === backdrop) root.innerHTML = ""; };
    const modal = elx("div", { class: "modal" });
    const closeBtn = elx("button", { class: "modal-close" }, [text("\u00D7")]);
    closeBtn.onclick = () => { root.innerHTML = ""; };
    modal.appendChild(closeBtn);
    modal.appendChild(elx("h3", {}, [text(d.name)]));
    modal.appendChild(elx("div", { class: "meta" }, [text(`Class ${d.cls} \u00B7 ${d.date} \u00B7 Submitted ${new Date(d.submittedAt).toLocaleString()} \u00B7 Part A: ${d.mcqScore}/${d.mcqTotal}`)]));

    function block(k, v, img) {
      const b = elx("div", { class: "block" }, [elx("div", { class: "k" }, [text(k)])]);
      if (img) b.appendChild(elx("img", { class: "qimg-modal", src: img }));
      b.appendChild(elx("div", { class: "v" }, [text(v || "\u2014")]));
      return b;
    }

    modal.appendChild(elx("div", { class: "section-h" }, [text("Part A \u2014 Multiple Choice")]));
    PART_A.forEach((mcq, i) => {
      const given = d.mcqAnswers[i];
      const givenText = given === null || given === undefined ? "No answer" : mcq.options[given] + (given === mcq.correct ? "  \u2713" : "  \u2717 (correct: " + mcq.options[mcq.correct] + ")");
      modal.appendChild(block("Q" + (i + 1), givenText, mcq.img));
    });

    modal.appendChild(elx("div", { class: "section-h" }, [text("Part B \u2014 Short Answer")]));
    let sbIdx = 0;
    PART_B.forEach((qb) => {
      qb.parts.forEach((p) => {
        p.answers.forEach((spec, ai) => {
          const raw = d.shortAnswers[sbIdx] || "";
          const label = "Q" + qb.num + p.label + (spec.prompt ? " (" + spec.prompt + ")" : "");
          modal.appendChild(block(label, teacherAnswerLine(raw, spec), ai === 0 ? p.img : null));
          sbIdx++;
        });
      });
    });

    modal.appendChild(elx("div", { class: "section-h" }, [text("Part C \u2014 Extended Response")]));
    let ecIdx = 0;
    PART_C.parts.forEach((p) => {
      p.answers.forEach((spec) => {
        const raw = d.extendedAnswers[ecIdx] || "";
        const label = "Q" + PART_C.num + p.label + (spec.prompt ? " (" + spec.prompt + ")" : "");
        modal.appendChild(block(label, teacherAnswerLine(raw, spec)));
        ecIdx++;
      });
    });

    backdrop.appendChild(modal);
    root.appendChild(backdrop);
  }

  // Teacher-facing summary line for a Part B/C answer: shows what the
  // student wrote, whether it's correct, and (unlike the student view) the
  // expected answer, since the teacher needs it to mark by hand regardless.
  function teacherAnswerLine(raw, spec) {
    if (!raw || !raw.trim()) return "No answer given.";
    if (spec.autoCheck === false) return "\\u201c" + raw + "\\u201d  (not auto-checked \u2014 please check manually)";
    const status = gradeAnswer(raw, spec);
    const expected = spec.exactStrings ? spec.exactStrings[0] : (spec.decimal + (spec.unit ? " " + spec.unit : ""));
    if (status === "correct") return "\\u201c" + raw + "\\u201d  \\u2713 correct";
    if (status === "unit-missing") return "\\u201c" + raw + "\\u201d  \\u2717 right number, wrong/missing unit (expected: " + expected + ")";
    return "\\u201c" + raw + "\\u201d  \\u2717 incorrect (expected: " + expected + ")";
  }

  function renderTeacher() {
    const root = document.getElementById("view-teacher");
    root.innerHTML = "";

    const toolbar = elx("div", { class: "teacher-toolbar" });
    const backBtn = elx("button", { class: "btn secondary small" }, [text("\u2190 Back to exam")]);
    backBtn.onclick = () => {
      document.getElementById("view-teacher").style.display = "none";
      document.getElementById("view-student").style.display = "";
    };
    toolbar.appendChild(backBtn);
    const clsField = elx("div", { class: "field" }, [elx("label", { class: "field-label" }, [text("Class")])]);
    const clsSel = elx("select");
    ["All"].concat(CLASSES).forEach((c) => {
      const opt = elx("option", { value: c }, [text(c)]);
      if (c === filterCls) opt.selected = true;
      clsSel.appendChild(opt);
    });
    clsSel.onchange = (e) => { filterCls = e.target.value; renderTeacher(); };
    clsField.appendChild(clsSel);

    const dateField = elx("div", { class: "field" }, [elx("label", { class: "field-label" }, [text("Date")])]);
    const dateSel = elx("input", { type: "date" });
    dateSel.value = filterDate; dateSel.onchange = (e) => { filterDate = e.target.value; renderTeacher(); };
    dateField.appendChild(dateSel);
    const clearDateBtn = elx("button", { class: "btn secondary small" }, [text("Clear date")]);
    clearDateBtn.onclick = () => { filterDate = ""; renderTeacher(); };

    const refreshBtn = elx("button", { class: "btn secondary small" }, [text("Refresh")]);
    refreshBtn.onclick = loadTeacherData;
    const csvBtn = elx("button", { class: "btn small" }, [text("Download CSV")]);
    csvBtn.onclick = downloadCsv;

    toolbar.appendChild(clsField); toolbar.appendChild(dateField); toolbar.appendChild(clearDateBtn);
    toolbar.appendChild(refreshBtn); toolbar.appendChild(csvBtn);
    root.appendChild(toolbar);

    if (teacherLoading) { root.appendChild(elx("div", { class: "empty-state" }, [text("Loading submissions\u2026")])); return; }
    if (teacherError) { root.appendChild(elx("div", { class: "empty-state" }, [text(teacherError)])); return; }
    const data = filteredData();
    if (data.length === 0) {
      root.appendChild(elx("div", { class: "empty-state" }, [text("No submissions yet for this filter.")]));
      return;
    }

    root.appendChild(elx("div", { class: "footnote" }, [text(data.length + " submission" + (data.length === 1 ? "" : "s") + " \u00B7 click a row for full answers, including Parts B & C")]));
    const table = elx("table", { class: "roster" });
    table.appendChild(elx("tr", {}, ["Name", "Class", "Date", "Part A", "Submitted"].map((h) => elx("th", {}, [text(h)]))));
    data.forEach((d) => {
      const tr = elx("tr");
      tr.onclick = () => showDetail(d);
      tr.appendChild(elx("td", {}, [text(d.name)]));
      tr.appendChild(elx("td", {}, [elx("span", { class: "badge-cls" }, [text(d.cls)])]));
      tr.appendChild(elx("td", {}, [text(d.date)]));
      tr.appendChild(elx("td", {}, [text(d.mcqScore + " / " + d.mcqTotal)]));
      tr.appendChild(elx("td", {}, [text(new Date(d.submittedAt).toLocaleString())]));
      table.appendChild(tr);
    });
    root.appendChild(table);
  }

  document.getElementById("tab-teacher-btn").onclick = () => {
    if (!staffUnlocked) {
      const entered = window.prompt("Staff PIN required to view the dashboard:");
      if (entered === null) return;
      if (entered !== TEACHER_PIN) { window.alert("Incorrect PIN."); return; }
      staffUnlocked = true;
    }
    document.getElementById("view-student").style.display = "none";
    document.getElementById("view-teacher").style.display = "";
    loadTeacherData();
  };

  renderStudent();
})();
</script>
